<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Glacier Tasks icon (D23): Glacier Notes family — navy background, folded page,
       ice-blue snowflake — with a three-column task board on the page. -->
  <rect width="1024" height="1024" fill="#0d1b2a"/>

  <!-- Page with folded top-right corner -->
  <path d="M248 168h416l136 136v520a40 40 0 0 1-40 40H248a40 40 0 0 1-40-40V208a40 40 0 0 1 40-40z" fill="#eef2f7"/>
  <path d="M664 168v96a40 40 0 0 0 40 40h96z" fill="#c5d3e2"/>

  <!-- Board columns: header bars and cards -->
  <g fill="#9fb4c9">
    <rect x="264" y="336" width="140" height="20" rx="10"/>
    <rect x="442" y="336" width="140" height="20" rx="10"/>
    <rect x="620" y="336" width="124" height="20" rx="10"/>
  </g>
  <g>
    <rect x="264" y="384" width="140" height="92" rx="18" fill="#4cc9f0"/>
    <rect x="264" y="496" width="140" height="92" rx="18" fill="#4cc9f0"/>
    <rect x="264" y="608" width="140" height="92" rx="18" fill="#4cc9f0"/>
    <rect x="442" y="384" width="140" height="92" rx="18" fill="#3aa8dd"/>
    <rect x="442" y="496" width="140" height="92" rx="18" fill="#3aa8dd"/>
    <rect x="620" y="384" width="124" height="92" rx="18" fill="#1f7fc0"/>
  </g>

  <!-- Snowflake badge -->
  <circle cx="736" cy="760" r="150" fill="#0d1b2a"/>
  <circle cx="736" cy="760" r="126" fill="#1b263b"/>
  <g stroke="#4cc9f0" stroke-width="22" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="736" y1="760" x2="736" y2="664"/>
      <polyline points="708,684 736,712 764,684"/>
    </g>
    <use href="#arm" transform="rotate(60 736 760)"/>
    <use href="#arm" transform="rotate(120 736 760)"/>
    <use href="#arm" transform="rotate(180 736 760)"/>
    <use href="#arm" transform="rotate(240 736 760)"/>
    <use href="#arm" transform="rotate(300 736 760)"/>
  </g>
</svg>
